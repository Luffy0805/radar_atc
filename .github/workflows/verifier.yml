# Vérifications automatiques du mod radar_atc (voir tools/check.py et CLAUDE.md).
# Le job échoue si check.py trouve une erreur ; les avertissements ne le font pas échouer.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : check.py compare la version de mod.conf à l'historique
      - name: Installer LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Lancer tools/check.py
        run: python3 tools/check.py
